name: Myfxbook Telegram Calendar

on:
  workflow_dispatch:
  schedule:
    - cron: "17 8 * * *"
      timezone: "Africa/Casablanca"
    - cron: "45 12 * * *"
      timezone: "Africa/Casablanca"
    - cron: "45 14 * * *"
      timezone: "Africa/Casablanca"

jobs:
  send-calendar:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Send Telegram calendar
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SOURCE_TIMEZONE: "UTC"
          TIMEZONE: "Africa/Casablanca"
          FOREX_FACTORY_TIMEZONE: "America/New_York"
          CURRENCIES: "USD"
          IMPACTS: "High"
          LOOKAHEAD_DAYS: "7"
          SEND_EMPTY: "true"
        run: python agent.py
